services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: medkb-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8899:8000"
    volumes:
      - /opt/medkb/kb:/data/kb:ro
      - /opt/medkb/img:/data/img:ro
      - /opt/medkb/uimg:/data/uimg
      - /opt/medkb/imgcache:/data/imgcache
    networks:
      - panel

networks:
  panel:
    name: 1panel-network
    external: true
