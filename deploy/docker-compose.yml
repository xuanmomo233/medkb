services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: medkb-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8899:8000"
    volumes:
      - /opt/medkb-v2/src/backend/app/data/question_evidence_review_queue.json:/srv/app/data/question_evidence_review_queue.json:ro
      - /opt/medkb/img:/data/img:ro
      - /opt/medkb/textbooks:/data/textbooks:ro
      - /opt/medkb/textbook-pdfs:/data/textbook-pdfs:ro
      - /opt/medkb/app-release.apk:/data/app-release.apk:ro
      - /opt/medkb/uimg:/data/uimg
      - /opt/medkb/imgcache:/data/imgcache
    networks:
      - panel

networks:
  panel:
    name: 1panel-network
    external: true
