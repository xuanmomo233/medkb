<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>医学知识库 · 背诵记忆</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --side:#fafbfc; --line:#e4e7ec; --txt:#1f2328; --sub:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --good:#16a34a; --good-soft:#dcfce7;
  --bad:#dc2626; --bad-soft:#fee2e2; --warn:#d97706; --warn-soft:#fef3c7; --warn-txt:#92600e;
  --card-shadow:0 4px 20px rgba(15,23,42,.08); --radius:14px;
}
body.dark{
  --bg:#0f172a; --panel:#1e293b; --side:#16213a; --line:#334155; --txt:#e2e8f0; --sub:#94a3b8;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --good:#4ade80; --good-soft:#14532d;
  --bad:#f87171; --bad-soft:#7f1d1d; --warn:#fbbf24; --warn-soft:#78350f; --warn-txt:#fbbf24;
  --card-shadow:0 4px 20px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0}
body{font:15px/1.75 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;display:flex;height:100vh;color:var(--txt);background:var(--bg);transition:background .25s,color .25s}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--sub)}
button{font-family:inherit}
input,select{font-family:inherit}

/* ===== 导航 ===== */
#navrail{width:66px;min-width:66px;display:flex;flex-direction:column;align-items:center;background:var(--side);border-right:1px solid var(--line);padding:10px 0;z-index:10}
#navrail .logo{font-size:24px;margin-bottom:14px}
#navrail button{width:54px;padding:9px 0 6px;border:0;border-radius:12px;background:none;cursor:pointer;color:var(--sub);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;margin-bottom:4px;transition:all .12s;-webkit-tap-highlight-color:transparent}
#navrail button .ic{font-size:21px;line-height:1.1}
#navrail button:hover{background:var(--accent-soft);color:var(--accent)}
#navrail button.on{background:var(--accent);color:#fff}
#navrail .sp{flex:1}
#navrail button.tiny{font-size:10px;padding:7px 0 5px}
#navrail button.tiny .ic{font-size:17px}
#bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:120;padding-bottom:env(safe-area-inset-bottom,0)}
#bnav button{flex:1;padding:8px 0 6px;border:0;background:none;font-size:11px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;-webkit-tap-highlight-color:transparent}
#bnav button .ic{font-size:20px;line-height:1.2}
#bnav button.on{color:var(--accent);font-weight:700}

/* ===== 主区 ===== */
#right{flex:1;min-width:0;display:flex;flex-direction:column}
#topbar{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);min-height:52px}
#crumb{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
#crumb .dim{color:var(--sub);font-weight:400}
#statbar{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:3px 11px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:default;display:inline-block}
.pill.blue{background:var(--accent-soft);color:var(--accent)}
.pill.red{background:var(--bad-soft);color:var(--bad)}
.pill.green{background:var(--good-soft);color:var(--good)}
.pill.yellow{background:var(--warn-soft);color:var(--warn-txt)}
.tbtn{border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:9px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
#main{flex:1;overflow-y:auto;padding:22px 28px 100px;scroll-behavior:smooth}
.wrap{max-width:920px;margin:0 auto}
.ver{opacity:.55;font-size:11px}

/* ===== markdown 排版 ===== */
h1{font-size:22px;margin-bottom:8px;letter-spacing:.3px}
h2{font-size:17px;margin:20px 0 8px;padding-left:11px;border-left:4px solid var(--accent);color:var(--txt)}
h3{font-size:15.5px;margin:15px 0 5px;color:var(--accent)}
h4{font-size:14.5px;margin:12px 0 4px}
p{margin:5px 0}
ul,ol{padding-left:22px;margin:5px 0}
li{margin:3px 0}
table{border-collapse:collapse;margin:10px 0;font-size:13.5px;display:block;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
td,th{min-width:64px;padding:5px 10px;border:1px solid var(--line)}
th{background:var(--accent-soft)}
tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 55%,transparent)}
blockquote{border-left:3px solid var(--warn);background:var(--warn-soft);padding:9px 14px;margin:10px 0;border-radius:0 8px 8px 0;font-size:14px}
#main img{max-width:100%;border-radius:8px;margin:4px 0;cursor:zoom-in}
code{background:var(--accent-soft);padding:1px 6px;border-radius:5px;font-size:13px}
.src{margin-bottom:14px;font-size:12.5px;color:var(--sub)}
/* 元信息条 + 记忆友好排版 */
.metabar{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 16px;align-items:center}
#main .wrap li{margin:6px 0}
#main .wrap li::marker{color:var(--accent);font-weight:700}
#main .wrap ul ul{border-left:2px solid var(--line);padding-left:16px;margin-left:2px}
#main .wrap ul ul li::marker{color:var(--sub)}
#main .wrap strong{color:var(--accent)}
#main .wrap h1{margin-top:4px}
/* 语义标记：考点词/考频年份/★星级 */
mark.kw{background:var(--accent-soft);color:var(--accent);padding:0 5px;border-radius:5px;font-weight:700}
.yr{color:var(--sub);font-size:.85em}
.ex{color:#f59e0b;letter-spacing:1px}
.tag{display:inline-block;background:var(--warn-soft);color:var(--warn);font-size:11.5px;padding:1px 7px;border-radius:9px;font-weight:600;margin-left:4px;vertical-align:1px}
/* 导图分节：顶层带子级的 li 变为小节卡片 */
li.sec{list-style:none;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:10px 14px;margin:12px 0 12px -24px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
li.sec>strong{display:block;font-size:16px;margin-bottom:4px}
li.sec li.sec{margin-left:0}

/* ===== 浏览页树 ===== */
.grp{display:flex;align-items:center;gap:6px;font-weight:700;margin:16px 0 6px;font-size:14px;padding:8px 12px;border-radius:10px;background:var(--accent-soft);color:var(--txt)}
.sub{display:flex;align-items:center;color:var(--sub);font-size:13px;margin:6px 8px 2px;cursor:pointer;font-weight:600;padding:5px 8px;border-radius:8px}
.sub:hover{background:var(--accent-soft);color:var(--txt)}
.sub::before{content:"▸";margin-right:6px;transition:transform .15s;font-size:10px}
.sub.open::before{transform:rotate(90deg)}
.sub .cnt{margin-left:auto;opacity:.5;font-size:11.5px}
.leaf{padding:6px 10px 6px 30px;cursor:pointer;border-radius:8px;font-size:13.5px;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .1s}
.leaf:hover{background:var(--accent-soft)}
.leaf.active{background:var(--accent);color:#fff}

/* ===== 搜索页 ===== */
.sbar{display:flex;gap:8px;margin:4px 0 12px}
.sbar input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt);font-size:15px;outline:none}
.sbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chips{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap}
.chip{padding:5px 14px;border:1px solid var(--line);border-radius:20px;font-size:12.5px;cursor:pointer;background:var(--panel);color:var(--sub)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.result{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px;transition:background .1s}
.result:hover{background:var(--accent-soft)}
.result .t{font-size:12px;color:var(--sub);margin-bottom:2px}
.result .s{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kicon{display:inline-block;padding:0 7px;border-radius:5px;font-size:11.5px;margin-right:6px;background:var(--panel);border:1px solid var(--line)}

/* ===== 卡包 / 题池列表 ===== */
.pk{padding:6px 14px;border-radius:20px;font-size:13px;cursor:pointer;display:inline-block;margin:4px 6px 4px 0;border:1px solid var(--line);background:var(--panel);color:var(--txt);transition:all .1s}
.pk:hover{border-color:var(--accent);color:var(--accent)}
.fbar{display:flex;gap:10px;flex-wrap:wrap;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:8px 0 18px}
.fbar select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--txt);max-width:220px}
.b-show{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;padding:8px 22px;border-radius:9px;border:0;font-weight:600;cursor:pointer}
.b-ghost{padding:8px 16px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--txt);cursor:pointer}

/* ===== 卡片 / 刷题 ===== */
.card{max-width:860px;margin:16px auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 34px;box-shadow:var(--card-shadow)}
.card .loc{font-size:12.5px;color:var(--sub);margin-bottom:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card .term{font-size:22px;font-weight:800;color:var(--accent);margin-bottom:8px}
.card .body{border-top:1px dashed var(--line);padding-top:14px;margin-top:6px}
.stem{font-size:15.5px;margin-bottom:6px}
.reveal{display:block;width:100%;margin-top:18px;padding:15px;border:1.5px dashed var(--line);border-radius:12px;text-align:center;color:var(--accent);cursor:pointer;font-size:15px;font-weight:700;background:var(--accent-soft);transition:all .15s}
.reveal:hover{filter:brightness(.97);transform:translateY(-1px)}
.opts{margin:14px 0 4px}
.opts .o{display:flex;gap:10px;align-items:center;padding:9px 14px;margin:7px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:all .12s;background:var(--panel)}
.opts .o:hover{border-color:var(--accent)}
.opts .o b{min-width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--bg);border:1px solid var(--line);font-size:12.5px;flex-shrink:0}
.opts .o.sel{border-color:var(--accent);background:var(--accent-soft)}
.opts .o.sel b{background:var(--accent);color:#fff;border-color:var(--accent)}
.opts .o.hit{border-color:var(--good);background:var(--good-soft)}
.opts .o.hit b{background:var(--good);color:#fff;border-color:var(--good)}
.opts .o.miss{border-color:var(--bad);background:var(--bad-soft)}
.opts .o.miss b{background:var(--bad);color:#fff;border-color:var(--bad)}
.opts .o.lack{border-color:var(--warn);background:var(--warn-soft)}
.opts .o.lack b{background:var(--warn);color:#fff;border-color:var(--warn)}
.ans{margin:14px 0 10px;padding:10px 16px;background:var(--good-soft);border-radius:10px;font-weight:700;color:var(--good)}
.analysis{font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.relc{margin-top:12px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 12px;background:var(--bg)}
.rlt{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px}
.rlb{font-size:13px}
.abtn{margin-top:14px;padding:9px 18px;border:1px dashed var(--accent);border-radius:10px;background:transparent;color:var(--accent);font-size:13.5px;font-weight:600;cursor:pointer;width:100%}
.abtn:disabled{opacity:.6;cursor:default}

/* 操作条：导航行 + 评分行 */
.abar{display:flex;gap:10px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.abar button{padding:9px 18px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:600;background:var(--panel);color:var(--txt);transition:all .12s}
.abar button:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.b-again{background:var(--bad-soft)!important;color:var(--bad)!important;border-color:var(--bad)!important}
.b-hard{background:var(--warn-soft)!important;color:var(--warn)!important;border-color:var(--warn)!important}
.b-good{background:var(--good-soft)!important;color:var(--good)!important;border-color:var(--good)!important}
.b-star{font-size:16px;padding:9px 14px!important}
.b-star.on{background:var(--warn-soft)!important;color:var(--warn)!important;border-color:var(--warn)!important}
.rrow{display:flex;gap:10px;justify-content:center;margin-top:12px}
.rrow button{flex:1;max-width:170px;padding:11px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:700;border:1px solid}
.kbd{font-size:11px;opacity:.55;margin-left:3px}
.prog{height:6px;background:var(--bg);margin:18px -34px -26px;border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#7c3aed);transition:width .25s}

/* ===== 作答统计 + 讨论区 ===== */
.statbox{margin-top:14px;padding:10px 14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--sub)}
.distbar{display:flex;gap:4px;margin-top:6px;height:16px;border-radius:5px;overflow:hidden}
.distbar i{display:block;height:100%}
.cmtwrap{margin-top:18px;border-top:1px dashed var(--line);padding-top:10px}
.cmtwrap h4{margin:0 0 8px;font-size:13.5px;color:var(--sub)}
.cmt{padding:9px 12px;margin:7px 0;background:var(--bg);border-radius:9px;font-size:13.5px}
.cmt .cmh{display:flex;gap:8px;font-size:11.5px;color:var(--sub);margin-bottom:3px}
.cmt .like{margin-left:auto;cursor:pointer;color:var(--sub);user-select:none}
.cmt .like.on{color:var(--warn);font-weight:700}
.cmtform{display:flex;gap:8px;margin-top:8px}
.cmtform input{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--txt);font-size:13.5px}
.cmtform button{padding:8px 14px;border:1px solid var(--accent);border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.exambar{position:sticky;top:0;display:flex;gap:14px;align-items:center;padding:10px 16px;background:var(--accent);color:#fff;border-radius:10px;margin-bottom:14px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
.exambar button{background:#fff;color:var(--accent);border:0;border-radius:8px;padding:6px 16px;font-weight:700;cursor:pointer}
.rpt{max-width:720px;margin:20px auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;box-shadow:var(--card-shadow)}
.rpt .big{font-size:44px;font-weight:800;text-align:center}
.rpt .sub2{text-align:center;color:var(--sub);font-size:13px;margin-bottom:16px}
.rptrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.rptrow .nm{width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.rptrow .bar{flex:1;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.rptrow .bar i{display:block;height:100%;background:var(--accent)}
.rptrow .pc{width:70px;text-align:right;font-size:12px;color:var(--sub)}

/* ===== 今日 ===== */
.banner{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--card-shadow)}
.bcard .big{font-size:30px;font-weight:800;line-height:1.15}
.bcard .lab{color:var(--sub);font-size:12.5px;margin-top:2px}
.bcard .act{margin-top:8px;font-size:12px}
.goalbar{height:8px;background:var(--bg);border-radius:4px;margin-top:8px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.cal{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:14px 0}
.cal-head{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:10px}
.cal-head button{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:2px 10px;cursor:pointer;color:var(--txt)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12.5px;text-align:center}
.calgrid .dw{color:var(--sub);font-size:11px;padding:3px 0}
.calgrid .d{padding:5px 0;border-radius:7px;color:var(--txt)}
.calgrid .d.on{background:var(--accent);color:#fff;font-weight:700}
.calgrid .d.today{outline:2px solid var(--accent);outline-offset:-2px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:14px 0 22px}
.dashcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--card-shadow)}
.dashcard .num{font-size:32px;font-weight:800;line-height:1.2}
.dashcard .lab{color:var(--sub);font-size:13px;margin-bottom:10px}
.dashcard button{width:100%;padding:9px;border:0;border-radius:9px;font-weight:600;cursor:pointer;font-size:13.5px;margin-top:6px}

/* 导图原图 + 图片放大 */
.mmpages{margin:8px 0 14px}
.mmpages summary{cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:600;user-select:none}
.mmimgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.mmimgs img{width:112px;border:1px solid var(--line);border-radius:8px;cursor:zoom-in}
#imgbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:1400;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#imgbox img{max-width:97vw;max-height:94vh;object-fit:contain}
.qref{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--accent)}
/* 键盘可达控件焦点 + 提示条 */
.o:focus-visible,.qref:focus-visible,.pk:focus-visible,.chip:focus-visible,.leaf:focus-visible,.sub:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#_toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:1500;display:none;box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:88vw;text-align:center}

@media (prefers-reduced-motion:reduce){
  #main{scroll-behavior:auto}
  *{transition:none!important}
}
@media (max-width:860px){
  #navrail{display:none}
  #main{padding:14px 12px 84px}
  #topbar{padding:8px 12px;gap:6px}
  #statbar{display:none}
  .card{padding:18px 14px}
  .prog{margin:18px -14px -18px}
  .dashcard{padding:14px}
  .bnav{display:flex}
  #bnav{display:flex}
  .wrap{max-width:100%}
  .abar button{padding:8px 10px;font-size:12.5px}
}
</style>
</head>
<body>
<script>try{if(localStorage.getItem('dark')==='1')document.body.classList.add('dark')}catch(e){}</script>
<div id="navrail" role="navigation" aria-label="主导航">
  <div class="logo">🩺</div>
  <button data-t="today"><span class="ic">📅</span>今日</button>
  <button data-t="browse"><span class="ic">📂</span>浏览</button>
  <button data-t="search"><span class="ic">🔍</span>搜索</button>
  <button data-t="card"><span class="ic">🃏</span>背卡</button>
  <button data-t="quiz"><span class="ic">📝</span>刷题</button>
  <div class="sp"></div>
  <button class="tiny" id="darkbtn" onclick="toggleDark()"><span class="ic">🌙</span>主题</button>
  <button class="tiny" onclick="doLogout()" title="退出登录"><span class="ic">👤</span>退出</button>
</div>
<div id="right">
<div id="topbar"><span id="crumb">医学知识库</span><span id="statbar"></span></div>
<div id="main" role="main"></div>
</div>
<div id="bnav" role="navigation" aria-label="底部导航">
  <button data-t="today"><span class="ic">📅</span>今日</button>
  <button data-t="browse"><span class="ic">📂</span>浏览</button>
  <button data-t="search"><span class="ic">🔍</span>搜索</button>
  <button data-t="card"><span class="ic">🃏</span>背卡</button>
  <button data-t="quiz"><span class="ic">📝</span>刷题</button>
  <button data-t="mine"><span class="ic">👤</span>我的</button>
</div>
<script>

function authed(u, opt){
  opt = opt || {};
  opt.headers = Object.assign({'X-Token': TOKEN}, opt.headers || {});
  return fetch(u, opt).then(r=>{ if(r.status===401){ showLogin(); throw new Error('401'); } return r; });
}

const esca=s=>esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const SAN_TAGS=new Set('P BR HR H1 H2 H3 H4 H5 H6 UL OL LI BLOCKQUOTE PRE CODE EM STRONG B I U S DEL INS MARK SPAN A IMG TABLE THEAD TBODY TR TH TD SUP SUB SMALL DIV DETAILS SUMMARY'.split(' '));
const SAN_ATTR={A:['href','title','class'],IMG:['src','alt','title','loading'],MARK:['class'],SPAN:['class'],LI:['class'],CODE:['class'],DIV:['class'],TD:['colspan','rowspan'],TH:['colspan','rowspan'],DETAILS:['open']};
const SAN_CLS=new Set(['ex','yr','kw','sec']);
const SAN_URL=/^(\/|https?:|data:image\/|#|mailto:)/i;
function san(html){  // 服务端/AI生成HTML白名单消毒：剥危险标签+on*属性+非法URL
  const doc=new DOMParser().parseFromString(String(html||''),'text/html');
  const DROP=new Set(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','FORM','LINK','META','BASE']);
  (function walk(root){
    [...root.children].forEach(c=>{
      if(DROP.has(c.tagName)){c.remove();return;}
      if(!SAN_TAGS.has(c.tagName)){c.replaceWith(...[...c.childNodes]);walk(root);return;}
      [...c.attributes].forEach(a=>{
        const ok=(SAN_ATTR[c.tagName]||[]).includes(a.name.toLowerCase());
        if(!ok){c.removeAttribute(a.name);return;}
        const n=a.name.toLowerCase();
        if(n==='href'||n==='src'){
          const v=a.value.replace(/[\s\x00-\x1F]+/g,'');
          if(/^javascript:/i.test(v)||!SAN_URL.test(v))c.removeAttribute(a.name);
        }else if(n==='class'){
          const keep=[...c.classList].filter(x=>SAN_CLS.has(x));
          if(keep.length)c.className=keep.join(' ');else c.removeAttribute('class');
        }
      });
      walk(c);
    });
  })(doc.body);
  return doc.body.innerHTML;
}
function toast(msg,ms){

}

function qrefify(root){
  const INLINE=new Set(['CODE','A','B','I','STRONG','EM','SUB','SUP','SMALL','SPAN','U','S','MARK','KBD','BR']);
  root.querySelectorAll('p,div,code,li,td,blockquote,h1,h2,h3,h4').forEach(el=>{
    const kids=[...el.querySelectorAll('*')];
    if(kids.some(k=>!INLINE.has(k.tagName)))return;
    if(!/\bQ\d{4,}/.test(el.textContent))return;
    el.innerHTML = el.innerHTML.replace(/(^|[^\w"'=])Q(\d{4,})/g,
      '$1<a class="qref" href="javascript:void 0" onclick="openQref(\'$2\')">Q$2</a>');
  });
}

// 打卡日历（月份/今天一律按本地时区运算，不用 toISOString 的 UTC 口径）
const pad2=n=>String(n).padStart(2,'0');
function localYMD(d){d=d||new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function localYM(d){return localYMD(d).slice(0,7);}
function renderCal(ym){
  CAL_YM=ym;
  const [y,m]=ym.split('-').map(Number);
  api('/api/calendar?ym='+ym).then(c=>{
    const el=$('#calgrid'); if(!el)return;
    $('#calym').textContent=ym;
    const days=new Set(c.days.map(Number));
    const first=new Date(y,m-1,1).getDay();
    const dim=new Date(y,m,0).getDate();
    const todayStr=localYMD();
    let h='';
    '日一二三四五六'.split('').forEach(d=>{h+=`<div class="dw">${d}</div>`;});
    for(let i=0;i<first;i++)h+='<div></div>';
    for(let d=1;d<=dim;d++){
      const ds=`${ym}-${pad2(d)}`, hit=days.has(d);
      h+=`<div class="d ${hit?'on':''} ${ds===todayStr?'today':''}" aria-label="${ds}${hit?' 已打卡':''}" title="${ds}${hit?' 已打卡':''}">${d}</div>`;
    }
    el.innerHTML=h;
  });
}
function calNav(d){
  const [y,m]=CAL_YM.split('-').map(Number);
  const dt=new Date(y,m-1+d,1);
  renderCal(localYM(dt));
}
function doCheckin(){
  authed('/api/checkin',{method:'POST'}).then(()=>showToday());
}
function setGoal(){
  const v=prompt('每日学习目标（评分条数）','30');
  if(v===null)return;
  const n=+v;
  if(!Number.isInteger(n)||n<1||n>2000){toast('请输入 1~2000 的整数');return;}
  authed('/api/goal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:n})}).then(()=>showToday());
}
function setExam(){
  const v=prompt('考研日期（YYYY-MM-DD）','2026-12-19');
  if(v===null)return;
  const s=(v||'').trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)||isNaN(new Date(s+'T00:00:00').getTime())){toast('日期格式应为 YYYY-MM-DD');return;}
  authed('/api/exam',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({date:s})}).then(()=>showToday());
}

  let h='<div class="wrap">';
  const groups=[['导图','📗 思维导图'],['知识点','⭐ 考点精要'],['题库','📒 题库（点击章节直接刷题）']];
  for(const [key,label] of groups){
    h+=`<div class="grp">${label}</div>`;
    const subs={};
    TREE[key].forEach(c=>{const s=c.subj||c.subjdir;(subs[s]=subs[s]||[]).push(c);});
    for(let s in subs){
      h+=`<div class="sub" tabindex="0" role="button" aria-expanded="false" onclick="tog(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tog(this)}">${esc(s)}<span class="cnt">${subs[s].length}</span></div><div style="display:none">`;
      subs[s].forEach(c=>{
        if(key==='题库')h+=`<div class="leaf" tabindex="0" onclick='startQuiz(null,${esca(JSON.stringify(c.chapter))})' onkeydown="if(event.key==='Enter')this.click()" title="${esca(c.chapter)}">▶ ${esc(c.chapter)}</div>`;

function tog(el){ el.classList.toggle('open'); el.setAttribute('aria-expanded',el.classList.contains('open')); const nx=el.nextElementSibling; nx.style.display=nx.style.display==='none'?'':'none'; }

let CUR_CH=null;
function showChapter(id){
  MODE='chapter'; CUR_CH=id;
  api('/api/chapter?id='+id).then(c=>{
    crumb(`📂 <span class="dim">${c.subj} / </span>${c.title}`);
    let imgs='';
    if(c.pages&&c.pages.length){
      imgs='<details class="mmpages" open><summary>📄 原书页面对照（'+c.pages.length+'页，点击放大）</summary><div class="mmimgs">'

        +'</div></details>';
    }
    const m=c.meta||{};
    const metabar=(m.tags||m['考试频率']||c.pages.length)?`<div class="metabar">
      ${m.tags?`<span class="pill blue">📘 ${esc(m.tags)}</span>`:''}
      ${m['考试频率']?`<span class="pill yellow">🔥 ${esc(m['考试频率'])}</span>`:''}

      <span class="dim" style="color:var(--sub);font-size:12px;margin-left:auto">${esc(c.src)}</span>
    </div>`:'';
    $('#main').innerHTML=`<div class="wrap"><div style="margin-bottom:6px">${backBtn()}<a class="qref" tabindex="0" onclick="navGo('browse')" style="margin-left:10px">📂 目录</a></div><h1>${esc(c.title)}</h1>${metabar}${imgs}${san(c.html)}</div>`;

    $$('#main .wrap ul').forEach(ul=>{

      [...ul.children].forEach(li=>{ if(li.querySelector(':scope > ul')) li.classList.add('sec'); });
    });
    qrefify(document.getElementById('main'));
  });
}

function kchip(el){
  $$('#kchips .chip').forEach(c=>c.classList.toggle('on',c===el));
  S_KIND=el.dataset.k;
  if($('#mq').value.trim())doSearch();
}
function doSearch(){
  const q=$('#mq').value.trim(); if(!q)return;
  $('#sres').innerHTML='<div style="color:var(--sub);font-size:12.5px">搜索中…</div>';
  api('/api/search?q='+encodeURIComponent(q)+(S_KIND?'&kind='+S_KIND:'')).then(rs=>{
    let h='';
    if(!rs.length) h='<p style="color:var(--sub)">无结果，换个词试试</p>';
    rs.forEach(r=>{
      const icon={q:'📄 题目',k:'⭐ 考点',c:'📗 章节'}[r.kind];
      h+=`<div class="result" tabindex="0" onclick="openResult('${esca(r.kind)}',${+r.ref_id||0})" onkeydown="if(event.key==='Enter')this.click()">
        <div class="t"><span class="kicon">${icon}</span>${esc(r.title)}${r.starred?' ⭐':''}${r.state==='again'?' <span style="color:var(--bad)">[错题]</span>':''}</div>
        <div class="s">${san(r.snip||'')}</div></div>`;
    });
    $('#sres').innerHTML=`<div style="color:var(--sub);font-size:12.5px;margin-bottom:6px">「${esc(q)}」 ${rs.length} 条</div>`+h;
    $('#sres').style.color='';
  }).catch(()=>{ $('#sres').innerHTML='<div style="color:var(--sub);font-size:12.5px">搜索失败 <button class="b-ghost" onclick="doSearch()">重试</button></div>'; });
}
function openResult(kind,id){
  if(kind==='c'){ setTab('browse'); showChapter(id); return; }
  if(kind==='q'){ startQuiz([id]); return; }
  startCards(null,null,id);
}

function startCards(subj, part, oneId){
  let url='/api/cards?';
  if(subj)url+='subj='+encodeURIComponent(subj)+'&';
  if(part)url+='part='+encodeURIComponent(part)+'&';
  if(oneId&&!subj)url+='ids='+oneId+'&';
  api(url).then(cs=>{ CARDS=cs; if(oneId){CI=Math.max(0,cs.findIndex(c=>c.id==oneId));}else CI=0;
    MODE='card'; setTab('card'); showCard(); });
}
function startCardIds(ids){
  api('/api/cards?ids='+ids.join(',')).then(cs=>{CARDS=cs;CI=0;MODE='card';setTab('card');showCard();});
}
function startCardPlan(n){
  api('/api/cards?plan='+n).then(cs=>{CARDS=cs;CI=0;MODE='card';setTab('card');showCard();});
}

// 卡片源题详解：拉取该卡 qids 的源题 题干+答案+解析（教材级原理）
function cardSrc(kid,link){
  link.style.display='none';
  const box=document.getElementById('csrc');
  box.innerHTML='<div style="color:var(--sub);font-size:13px">加载中…</div>';
  api('/api/card_src?id='+kid).then(qs=>{
    if(!qs.length){box.innerHTML='<div style="color:var(--sub);font-size:13px">该卡无关联源题</div>';return;}
    box.innerHTML=qs.map(q=>`<div style="margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px">
      <div style="font-size:12px;color:var(--sub)">Q${q.qid} · ${esc(q.system||'')}</div>
      <div style="margin:6px 0">${san(q.stem)}</div>
      <div style="font-size:13px;color:var(--good);font-weight:600">答案：${esc(q.answer||'见解析')}</div>
      <div style="margin-top:4px">${san(q.analysis||'')}</div>
    </div>`).join('');
    qrefify(box);
  }).catch(()=>{ box.innerHTML='<div style="color:var(--sub);font-size:13px">加载失败 <a class="qref" tabindex="0" onclick="cardSrc('+kid+',this)">重试</a></div>'; });
}
// 卡号网格跳转（同刷题页 qjump）
function cjump(){
  const old=document.getElementById('qjump'); if(old){old.remove();return;}
  const d=document.createElement('div');
  d.id='qjump';
  d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px';
  const cells=CARDS.map((c,idx)=>{
    const bd=idx===CI?'border:2px solid var(--pri,#3b82f6)':'border:1px solid var(--line,#ccc)';
    return `<div onclick="cgo(${idx})" title="${esca(c.term||'')}" style="padding:8px 0;text-align:center;border-radius:8px;cursor:pointer;font-size:13px;${bd}">${idx+1}</div>`;
  }).join('');
  d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label','卡片跳转');
  d.innerHTML=`<div style="background:var(--bg,#fff);border-radius:14px;padding:14px;width:min(560px,96vw);max-height:88vh;overflow:auto;box-shadow:0 8px 40px #0006">
    <div style="font-size:13px;color:var(--sub,#888);margin-bottom:8px">共 ${CARDS.length} 卡 · 点数字跳转</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px">${cells}</div></div>`;
  d.onclick=e=>{if(e.target===d)d.remove();};
  document.body.appendChild(d);
}
function cgo(idx){ CI=idx; const d=document.getElementById('qjump'); if(d)d.remove(); showCard(); }
function rate(r){
  const c=CARDS[CI]; if(rate._busy)return; rate._busy=true;
  authed('/api/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'k',ref:c.id,rating:r})}).then(()=>{loadStats();nav(1);}).finally(()=>{rate._busy=false;});
}
function star(kind,id,btn){
  if(btn.disabled)return; btn.disabled=true;
  const on=btn.classList.contains('on');
  authed('/api/mark',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,ref:id,rating:on?'unstar':'star'})}).then(()=>{btn.classList.toggle('on');loadStats();})
    .catch(()=>toast('操作失败')).finally(()=>{btn.disabled=false;});
}

  $$('#main .chip').forEach(c=>c.classList.remove('on')); if(el)el.classList.add('on'); }
function loadWrongbook(){
  api('/api/wrongbook').then(rows=>{
    const box=document.getElementById('wbbox'); if(!box)return;
    if(!rows.length){ box.innerHTML=''; return; }
    let h=`<h2>📕 错题本（${rows.reduce((a,b)=>a+b.n,0)} 题）</h2><div>`;

function startQuiz(ids, chapter, extra, mode){
  let url='/api/quiz?';
  if(ids) url+='ids='+ids.join(',')+'&';
  if(chapter) url+='chapter='+encodeURIComponent(chapter)+'&';
  if(extra) url+=extra;
  if(mode)QMODE=mode;
  api(url).then(qs=>{
    // 会话边界：旧计时器必须清除；测试模式换新会话则重置计时起点（沿用标题/时长）
    if(window._exT){clearInterval(window._exT);window._exT=null;}
    QUIZ=qs;QI=0;TESTDONE=false;
    if(mode==='test'){
      TESTINFO=TESTINFO||{title:'测试',mins:0,t0:Date.now()};  // 模考入口已设 title/mins 则沿用

      TESTINFO={title:'测试',mins:0,t0:Date.now()};            // 自选测试模式：新会话重置计时
    }else{ TESTINFO=null; clearTest(); }

function qAnsLetters(q){ return (q.answer||'').toUpperCase().match(/[A-J]/g)||[]; }
function statHtml(q){
  const s=QSTAT[q.id]; if(!s||!s.tot)return '';
  const rate=Math.round(100*s.ok/s.tot);
  const totP=Object.values(s.dist||{}).reduce((a,b)=>a+b,0)||1;
  const corr=qAnsLetters(q);
  let bars='';
  const colors={hit:'var(--good)',miss:'var(--bad)',mid:'var(--sub)'};
  Object.keys(s.dist||{}).sort().forEach(L=>{
    const pc=Math.round(100*s.dist[L]/totP);
    bars+=`<i style="width:${pc}%;background:${corr.includes(L)?colors.hit:colors.miss}" title="${L}: ${s.dist[L]}人次（${pc}%）"></i>`;
  });
  return `<div class="statbox">📊 全站做过 <b>${s.tot}</b> 人次 · 正确率 <b style="color:${rate>=60?'var(--good)':'var(--bad)'}">${rate}%</b>
    <div class="distbar">${bars}</div>
    <div style="font-size:11px;margin-top:3px">${Object.keys(s.dist||{}).sort().map(L=>`${L} ${Math.round(100*s.dist[L]/totP)}%`).join(' · ')}</div></div>`;
}

      $$('#opts .o').forEach(e2=>{const on=s.has(+e2.dataset.i);e2.classList.toggle('sel',on);e2.setAttribute('aria-checked',on?'true':'false');});

    };});
  if(recite){ // 背题：看题即算看过 + 挂评论

function submitTest(){

    clearTest(); if(window._exT){clearInterval(window._exT);window._exT=null;}
    (rep.results||[]).forEach(r2=>{
      if(r2.judged){JDONE.add(r2.id); if(!r2.ok){JWRONG.add(r2.id);
        const q=QUIZ.find(x=>x.id===r2.id); if(q)q.state='again';}

function submitMulti(qid){

  const sels=[];

  recordAttempt(q, sels.map(l=>l.charCodeAt(0)-65));

})();
