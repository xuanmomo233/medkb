publish_to: 'none'
version: 2.2.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  html: ^0.15.4
  crypto: ^3.0.5
  shared_preferences: ^2.2.0
  flutter_widget_from_html_core: ^0.15.2
  url_launcher: ^6.2.0
  image_picker: ^1.1.2
