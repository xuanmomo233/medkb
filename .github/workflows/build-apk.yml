name: build-apk

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  apk:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: read pubspec version
        id: ver
        run: echo "name=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> $GITHUB_OUTPUT

      # 注入构建号作为 APP 内版本号（用于更新检查）
      - name: inject build number
        run: sed -i "s/appBuild = [0-9]*/appBuild = ${{ github.run_number }}/" lib/api.dart

      # 仓库不含二进制 wrapper jar / 脚本，构建前补齐；SHA256 固定防上游被篡改
      - name: fetch gradle wrapper
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew -o android/gradlew
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew.bat -o android/gradlew.bat
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar
          echo "fb49f8cb2e5b1d83fba3dcc2c0dd0934c5655cbaf8bd1510ada7cc02692095ca  android/gradlew" | sha256sum -c -
          echo "49792578a7942e08b708df3d3902ddbfc49d2203775c0161ef0c24b23fe4aeae  android/gradlew.bat" | sha256sum -c -
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          chmod +x android/gradlew

      # 签名密钥从 secrets 解码（仓库不存放 jks/明文密码）；缺密钥直接失败，拒绝发出 debug 签名包
      - name: decode keystore
        env:
          KS_B64: ${{ secrets.MEDKB_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::MEDKB_KEYSTORE_B64 未配置，拒绝以 debug 签名构建发布包"
            exit 1
          fi
          echo "$KS_B64" | tr -d '[:space:]' | base64 -d > android/app/medkb.jks

      # versionName 取 pubspec 语义版本；versionCode 用 run_number 单调递增（安卓按它判定升级）
      - name: build apk
        env:
          MEDKB_STORE_FILE: medkb.jks
          MEDKB_STORE_PASSWORD: ${{ secrets.MEDKB_STORE_PASSWORD }}
          MEDKB_KEY_ALIAS: ${{ secrets.MEDKB_KEY_ALIAS }}
          MEDKB_KEY_PASSWORD: ${{ secrets.MEDKB_KEY_PASSWORD }}
        run: flutter build apk --release --build-number ${{ github.run_number }}

      # 校验产物签名：必须同时包含 v1(META-INF/*.RSA) 与 v2/v3 签名块，否则华为等机型无法安装
      - name: verify apk signature
        run: |
          python3 - <<'EOF'
          import zipfile
          p = 'build/app/outputs/flutter-apk/app-release.apk'
          names = zipfile.ZipFile(p).namelist()
          has_v1 = any(n.startswith('META-INF/') and n.endswith(('.RSA', '.DSA', '.EC')) for n in names)
          data = open(p, 'rb').read()
          has_v2 = b'APK Sig Block 42' in data
          print(f'v1={has_v1} v2/v3={has_v2}')
          if not (has_v1 and has_v2):
              raise SystemExit('APK 签名不完整（缺 v1 或 v2/v3），拒绝发布')
          EOF

      - name: release apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: MedKB v${{ steps.ver.outputs.name }} · build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
