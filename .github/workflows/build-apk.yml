name: build-apk

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: read pubspec version
        id: ver
        run: echo "name=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)" >> $GITHUB_OUTPUT

      # 注入构建号作为 APP 内版本号（用于更新检查）
      - name: inject build number
        run: sed -i "s/appBuild = [0-9]*/appBuild = ${{ github.run_number }}/" lib/api.dart

      # 仓库不含二进制 wrapper jar / 脚本，构建前补齐
      - name: fetch gradle wrapper
        run: |
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew -o android/gradlew
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew.bat -o android/gradlew.bat
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew

      # 签名密钥从 secrets 解码（仓库不存放 jks/明文密码）；缺省时回退 debug 签名
      - name: decode keystore
        env:
          KS_B64: ${{ secrets.MEDKB_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | tr -d '[:space:]' | base64 -d > android/app/medkb.jks
          else
            echo "::warning::no MEDKB_KEYSTORE_B64 secret; release apk will use debug signing"
          fi

      # versionName 取 pubspec 语义版本；versionCode 用 run_number 单调递增（安卓按它判定升级）
      - name: build apk
        env:
          MEDKB_STORE_FILE: medkb.jks
          MEDKB_STORE_PASSWORD: ${{ secrets.MEDKB_STORE_PASSWORD }}
          MEDKB_KEY_ALIAS: ${{ secrets.MEDKB_KEY_ALIAS }}
          MEDKB_KEY_PASSWORD: ${{ secrets.MEDKB_KEY_PASSWORD }}
        run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: release apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MedKB v${{ steps.ver.outputs.name }} · build ${{ github.run_number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
