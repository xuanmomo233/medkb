name: build-apk

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  apk:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: read pubspec version
        id: ver
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "name=${version%%+*}" >> "$GITHUB_OUTPUT"
          echo "build=${version##*+}" >> "$GITHUB_OUTPUT"

      - name: read current public APK
        id: current
        run: |
          curl -fsSL https://luck.021209.xyz/api/version -o "$RUNNER_TEMP/current-apk-version.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path
          version = json.loads((Path(os.environ["RUNNER_TEMP"]) / "current-apk-version.json").read_text())
          print(f"build={int(version['build'])}")
          print(f"sha256={version['apk_sha256']}")
          PY

      # 同时超过源码版本、线上下载包和当前工作流运行号，保证首次及后续发布均可升级。
      - name: select monotonic build number
        id: build
        run: |
          source_build='${{ steps.ver.outputs.build }}'
          workflow_floor=$(( ${{ github.run_number }} + 2 ))
          public_floor=$(( ${{ steps.current.outputs.build }} + 1 ))
          if (( workflow_floor > source_build )); then source_build=$workflow_floor; fi
          if (( public_floor > source_build )); then source_build=$public_floor; fi
          if (( source_build <= ${{ steps.current.outputs.build }} )); then
            echo "::error::新 APK 构建号未高于当前线上版本"
            exit 1
          fi
          echo "number=$source_build" >> "$GITHUB_OUTPUT"

      # 注入构建号作为 APP 内版本号（用于更新检查）
      - name: inject build number
        run: sed -i "s/appBuild = [0-9]*/appBuild = ${{ steps.build.outputs.number }}/" lib/api.dart

      # 仓库不含二进制 wrapper jar / 脚本，构建前补齐；SHA256 固定防上游被篡改
      - name: fetch gradle wrapper
        run: |
          set -e
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew -o android/gradlew
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew.bat -o android/gradlew.bat
          curl -fsSL https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar
          echo "fb49f8cb2e5b1d83fba3dcc2c0dd0934c5655cbaf8bd1510ada7cc02692095ca  android/gradlew" | sha256sum -c -
          echo "49792578a7942e08b708df3d3902ddbfc49d2203775c0161ef0c24b23fe4aeae  android/gradlew.bat" | sha256sum -c -
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar" | sha256sum -c -
          chmod +x android/gradlew

      # 签名密钥从 secrets 解码（仓库不存放 jks/明文密码）；缺密钥直接失败，拒绝发出 debug 签名包
      - name: decode keystore
        env:
          KS_B64: ${{ secrets.MEDKB_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::MEDKB_KEYSTORE_B64 未配置，拒绝以 debug 签名构建发布包"
            exit 1
          fi
          echo "$KS_B64" | tr -d '[:space:]' | base64 -d > android/app/medkb.jks

      # versionName 取 pubspec 语义版本；versionCode 用 run_number 单调递增（安卓按它判定升级）
      - name: build apk
        env:
          MEDKB_STORE_FILE: medkb.jks
          MEDKB_STORE_PASSWORD: ${{ secrets.MEDKB_STORE_PASSWORD }}
          MEDKB_KEY_ALIAS: ${{ secrets.MEDKB_KEY_ALIAS }}
          MEDKB_KEY_PASSWORD: ${{ secrets.MEDKB_KEY_PASSWORD }}
        run: flutter build apk --release --build-number ${{ steps.build.outputs.number }}

      # 校验产物签名：必须同时包含 v1(META-INF/*.RSA) 与 v2/v3 签名块，否则华为等机型无法安装
      - name: verify apk signature
        run: |
          python3 - <<'EOF'
          import zipfile
          p = 'build/app/outputs/flutter-apk/app-release.apk'
          names = zipfile.ZipFile(p).namelist()
          has_v1 = any(n.startswith('META-INF/') and n.endswith(('.RSA', '.DSA', '.EC')) for n in names)
          data = open(p, 'rb').read()
          has_v2 = b'APK Sig Block 42' in data
          print(f'v1={has_v1} v2/v3={has_v2}')
          if not (has_v1 and has_v2):
              raise SystemExit('APK 签名不完整（缺 v1 或 v2/v3），拒绝发布')
          EOF

      - name: verify upgrade signer against current download
        env:
          CURRENT_BUILD: ${{ steps.current.outputs.build }}
          CURRENT_SHA256: ${{ steps.current.outputs.sha256 }}
        run: |
          curl -fsSL "https://luck.021209.xyz/app.apk?v=$CURRENT_BUILD" -o "$RUNNER_TEMP/current.apk"
          echo "$CURRENT_SHA256  $RUNNER_TEMP/current.apk" | sha256sum --check
          old_cert=$(keytool -printcert -jarfile "$RUNNER_TEMP/current.apk" | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')
          new_cert=$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | awk -F': ' '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')
          if [[ -z "$old_cert" || "$old_cert" != "$new_cert" ]]; then
            echo "::error::新 APK 签名证书与当前正式下载包不一致，拒绝发布"
            exit 1
          fi
          echo "当前与候选 APK 的签名证书一致：$old_cert"

      - name: release apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.build.outputs.number }}
          target_commitish: ${{ github.sha }}
          name: MedKB v${{ steps.ver.outputs.name }} · build ${{ steps.build.outputs.number }}
          files: app/build/app/outputs/flutter-apk/app-release.apk
